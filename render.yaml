services:
  - type: web
    name: qaqc-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: qaqc-data
      mountPath: /var/data
      sizeGB: 1
