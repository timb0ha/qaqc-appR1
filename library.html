{% extends "base.html" %}
{% block title %}Check a Submittal{% endblock %}
{% block content %}
<h1>Check a Submittal</h1>
<form method="post" enctype="multipart/form-data" class="stack">
  <label>Submittal file (text or image)
    <input type="file" name="submittal" required>
  </label>
  <label>Checklist requirement this should satisfy
    <textarea name="requirement" rows="3" required></textarea>
  </label>
  <button type="submit">Check Submittal</button>
</form>
{% endblock %}
